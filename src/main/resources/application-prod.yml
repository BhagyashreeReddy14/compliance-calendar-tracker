# ── Production Profile ────────────────────────────────────────────────────────
# Activated via: SPRING_PROFILES_ACTIVE=prod
# All secrets MUST be supplied as environment variables — no hardcoded values.

spring:
  application:
    name: compliance-calendar-tracker

  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  datasource:
    url:                    ${DB_URL}
    username:               ${DB_USER}
    password:               ${DB_PASSWORD}
    driver-class-name:      org.postgresql.Driver
    hikari:
      maximum-pool-size:    10
      minimum-idle:         2
      connection-timeout:   30000
      idle-timeout:         600000
      max-lifetime:         1800000

  # ── JPA / Hibernate ──────────────────────────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto:             validate         # Flyway manages schema in prod
    show-sql:               false
    properties:
      hibernate:
        dialect:            org.hibernate.dialect.PostgreSQLDialect
        format_sql:         false

  # ── Flyway ───────────────────────────────────────────────────────────────────
  flyway:
    enabled:                true
    locations:              classpath:db/migration
    baseline-on-migrate:    true

  # ── Redis ────────────────────────────────────────────────────────────────────
  cache:
    type:                   redis
  data:
    redis:
      host:                 ${REDIS_HOST:localhost}
      port:                 ${REDIS_PORT:6379}
      password:             ${REDIS_PASSWORD:}
      timeout:              2000ms
      connect-timeout:      2000ms

  # ── Email ────────────────────────────────────────────────────────────────────
  mail:
    host:                   ${MAIL_HOST:smtp.gmail.com}
    port:                   ${MAIL_PORT:587}
    username:               ${MAIL_USERNAME}
    password:               ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth:             true
          starttls:
            enable:         true
            required:       true
        debug:              false

  # ── Multipart ────────────────────────────────────────────────────────────────
  servlet:
    multipart:
      enabled:              true
      max-file-size:        ${MAX_FILE_SIZE:10MB}
      max-request-size:     ${MAX_REQUEST_SIZE:10MB}

# ── JWT ─────────────────────────────────────────────────────────────────────
jwt:
  secret:     ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}

# ── Cache TTL ────────────────────────────────────────────────────────────────
cache:
  redis:
    ttl: ${CACHE_TTL:600}

# ── Notifications ────────────────────────────────────────────────────────────
notification:
  email:
    recipient: ${NOTIFICATION_EMAIL:admin@example.com}

# ── File Upload ──────────────────────────────────────────────────────────────
file:
  upload-dir: ${FILE_UPLOAD_DIR:/app/uploads}

# ── Logging ──────────────────────────────────────────────────────────────────
logging:
  level:
    com.example.tool:              INFO
    org.springframework.security:  WARN
    org.flywaydb:                  INFO
    org.springframework.cache:     WARN
    org.hibernate.SQL:             WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
