spring:
  application:
    name: compliance-calendar-tracker
  datasource:
    url: ${DB_URL:jdbc:h2:mem:compliance_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:create-drop}
    show-sql: false
    properties:
      hibernate:
        dialect: ${DB_DIALECT:org.hibernate.dialect.H2Dialect}
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: false
        debug: false
  servlet:
    multipart:
      enabled: true
      max-file-size: ${MAX_FILE_SIZE:10MB}
      max-request-size: ${MAX_REQUEST_SIZE:10MB}
  flyway:
    enabled: false
  cache:
    type: none
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      connect-timeout: 2000ms

jwt:
  secret: ${JWT_SECRET:mySecretKey1234567890123456789012345678901234567890}
  expiration: ${JWT_EXPIRATION:86400000}

cache:
  redis:
    ttl: ${CACHE_TTL:600}

notification:
  email:
    recipient: ${NOTIFICATION_EMAIL:admin@example.com}

file:
  upload-dir: ${FILE_UPLOAD_DIR:uploads}

logging:
  level:
    com.example.tool: INFO
    org.springframework.security: WARN
    org.flywaydb: INFO
    org.springframework.cache: TRACE
