<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; }
        .container { padding: 20px; border: 1px solid #ddd; border-radius: 5px; }
        .header { background-color: #f44336; color: white; padding: 10px; text-align: center; border-radius: 5px 5px 0 0; }
        .content { margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>Compliance Overdue Alert</h2>
        </div>
        <div class="content">
            <p>Hello,</p>
            <p>The following compliance record is now <strong>OVERDUE</strong>:</p>
            <p><strong>Title:</strong> <span th:text="${title}">Record Title</span></p>
            <p>Please take immediate action to resolve this.</p>
        </div>
    </div>
</body>
</html>
